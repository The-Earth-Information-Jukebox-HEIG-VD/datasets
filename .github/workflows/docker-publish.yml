# Build and publish Docker image to GitHub Container Registry
# Triggers on version tags (v*)
name: Docker Build & Push

on:
  push:
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      # data/ is ~9.1 GB: the checkout plus the build context copy need far
      # more than the ~14 GB a standard runner has free. Remove preinstalled
      # SDKs this image never uses (frees ~25 GB).
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/.ghcup /opt/hostedtoolcache /usr/share/swift \
                      /usr/local/share/boost /usr/local/share/powershell \
                      /usr/local/share/chromium /usr/local/lib/node_modules
          sudo docker image prune --all --force
          sudo swapoff -a && sudo rm -f /mnt/swapfile /swapfile || true
          df -h /

      - name: Checkout repository
        uses: actions/checkout@v4

      # The data is plain git (no LFS): .git holds a ~1.3 GB pack that the
      # image never uses (.dockerignore excludes it). Drop it before building.
      - name: Remove git metadata
        run: rm -rf .git && df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # Tag with version (v1.0.0 → 1.0.0)
            type=semver,pattern={{version}}
            # Tag with major.minor (v1.0.0 → 1.0)
            type=semver,pattern={{major}}.{{minor}}
            # Always tag with 'latest'
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # A tag only builds the image; the GitHub release (the "Releases" box) is made here,
  # once the image is published
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create the GitHub release (notes from the commits since the previous tag)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release $TAG already exists"
          else
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --verify-tag --generate-notes --title "$TAG"
          fi
